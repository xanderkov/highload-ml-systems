services:
  web:
    build: ./web
    ports:
      - "${COURSE_PORT:-18080}:8000"
    volumes:
      - ./content:/app/content:ro
    environment:
      RUNNER_URL: http://runner:8000
      CONTENT_ROOT: /app/content
    networks: [front, back]
    depends_on: [runner]

  runner:
    build: ./runner
    mem_limit: 3g
    # Генератор нагрузки держит по соединению на каждый запрос в полёте: под
    # перегрузкой их тысячи, а мягкий лимит Docker по умолчанию — 1024.
    ulimits:
      nofile: 65536
    init: true  # reap убитых потомков заданий (иначе остаются zombie)
    volumes:
      - ./content:/content:ro
      - model_repo:/models
      - triton_log:/triton-log:ro
    environment:
      CONTENT_ROOT: /content
    networks: [back]
    # Не ждать готовности Triton: разделы без него должны работать, даже если
    # сервер ещё грузится или упал (харнессы раздела «Triton» сами скажут,
    # что он недоступен).
    depends_on:
      triton:
        condition: service_started
    tmpfs:
      - /work:size=512m,mode=1777

  # Triton Inference Server для раздела «Triton»: модели грузит runner
  # (--model-control-mode=explicit) из общего тома model_repo. Серверу — те же
  # 3 CPU, что сервису в разделе 30 (SERVICE_MAX_CPUS); генератор нагрузки
  # runner'а прибит к CPU 0, вне этого набора.
  triton:
    build: ./triton
    # Студент правит конфиги в блоках: упавший сервер (например, по памяти)
    # поднимается сам, а не до ручного перезапуска.
    restart: unless-stopped
    cpuset: "${TRITON_CPUS:-1-3}"
    mem_limit: 4g
    shm_size: 1g  # python backend передаёт тензоры через /dev/shm
    # Каждое соединение — дескриптор. При лимите 1024 перегруженный сервер
    # переставал принимать соединения и в цикле писал «Too many open files».
    ulimits:
      nofile: 65536
    logging:
      options:
        max-size: "10m"
        max-file: "2"
    volumes:
      - model_repo:/models:ro
      - triton_log:/var/log/triton
    networks: [back]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/v2/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # vLLM для необязательного блока раздела «LLM». По умолчанию не запускается:
  # проверен только bf16 на процессоре с AVX-512, памяти нужно ~6 ГБ. Запуск:
  #   docker compose stop triton && docker compose --profile vllm up -d vllm
  # Модель скачивается при первом старте в том hf_cache (нужен интернет — сеть front).
  vllm:
    image: vllm/vllm-openai-cpu:v0.33.0
    profiles: [vllm]
    cpuset: "${TRITON_CPUS:-1-3}"
    mem_limit: 6g
    shm_size: 1g
    environment:
      VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_CPU_OMP_THREADS_BIND: "${TRITON_CPUS:-1-3}"
    command: ["--model", "Qwen/Qwen2.5-0.5B-Instruct", "--served-model-name", "q",
              "--dtype", "bfloat16", "--max-model-len", "2048"]
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks: [front, back]

volumes:
  model_repo:
  triton_log:  # вывод сервера: runner читает ошибки загрузки моделей
  hf_cache:  # модель vLLM

networks:
  front:
  back:
    internal: true
