kind: ab
lang: c
function: total
cflags: ["-O2"]
# 8e6 doubles = 64MB, one array shared by both fn_a/fn_b calls — must exceed
# last-level cache, or the strided ("slow") and sequential ("fast") sums both
# fit in cache and the compiler-equalized variants measure ~1.0x speedup.
sizes: [8000000]
warmup: 2
repeats: 5
timeout_s: 30
tolerance: 1e-9
