<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" width="620" height="236" role="img"
     aria-label="Иерархия памяти: регистры, L1, L2, L3, оперативная память — и относительная цена обращения в человеческом масштабе">
  <title>Иерархия памяти в человеческом масштабе</title>
  <style>
    /* Файл подключается тегом img, поэтому переменные страницы сюда не
       доходят и внешние шрифты не грузятся: палитра и моноширинный стек
       заданы внутри. Тема у страницы одна, тёмная, — значит и здесь одна,
       без переключения по системной настройке. */
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .name { font-size: 12px; fill: #97979f; }
    .scale { font-size: 11.5px; fill: #6f6f78; }
    .caption { font-size: 11.5px; fill: #6f6f78; }
    /* Цвета на странице нет: ступени серого. Уровни кэша светлые, оперативная
       память — тусклее, потому что она дороже, а не «слабее»: светлота здесь
       читается как близость к процессору. */
    .bar { fill: #d8d8dc; }
    .bar-far { fill: #55555c; }
    .rule { stroke: #2c2c30; stroke-width: 1; }
  </style>

  <!-- Подписи стоят в своей колонке и выключены вправо: столбики начинаются
       за самой длинной из них, поэтому текст физически не может на них налезть. -->
  <g class="name" text-anchor="end">
    <text x="72" y="26">регистр</text>
    <text x="72" y="56">L1</text>
    <text x="72" y="86">L2</text>
    <text x="72" y="116">L3</text>
    <text x="72" y="146">память</text>
  </g>

  <g class="bar">
    <rect x="84" y="16" width="6" height="13"/>
    <rect x="84" y="46" width="14" height="13"/>
    <rect x="84" y="76" width="42" height="13"/>
    <rect x="84" y="106" width="128" height="13"/>
  </g>
  <rect class="bar-far" x="84" y="136" width="404" height="13"/>

  <g class="scale">
    <text x="100" y="27">мгновенно</text>
    <text x="108" y="57">≈ 1 секунда</text>
    <text x="136" y="87">≈ 10 секунд</text>
    <text x="222" y="117">≈ полминуты</text>
    <text x="498" y="147">≈ 3 минуты</text>
  </g>

  <line class="rule" x1="0" y1="176" x2="620" y2="176"/>

  <g class="caption">
    <text x="0" y="198">Единицы человеческие: если попадание в L1 занимает секунду,</text>
    <text x="0" y="216">то поход в оперативную память в том же масштабе — около трёх минут.</text>
  </g>
</svg>
