<svg xmlns="http://www.w3.org/2000/svg" width="360" height="84" viewBox="0 0 360 84" role="img" aria-labelledby="title desc">
  <title id="title">Суммирование элементов матрицы</title>
  <desc id="desc">Две матрицы два на два. Сумма чисел первой — 14, второй — 10.</desc>
  <g font-family="JetBrains Mono, ui-monospace, monospace" text-anchor="middle" font-size="16" fill="#b8b8b8">
    <g transform="translate(4 12)">
      <path d="M10 0H2V55H10 M66 0H74V55H66" fill="none" stroke="#858585" stroke-width="1.5"/>
      <text y="21"><tspan x="24">1</tspan><tspan x="52">2</tspan></text>
      <text y="48"><tspan x="24">5</tspan><tspan x="52">6</tspan></text>
      <text x="95" y="35" fill="#969696">=</text>
      <text x="136" y="12" font-size="10" fill="#969696">сумма</text>
      <text x="136" y="38" font-size="24" fill="#cccccc">14</text>
    </g>
    <g transform="translate(194 12)">
      <path d="M10 0H2V55H10 M66 0H74V55H66" fill="none" stroke="#858585" stroke-width="1.5"/>
      <text y="21"><tspan x="24">3</tspan><tspan x="52">1</tspan></text>
      <text y="48"><tspan x="24">4</tspan><tspan x="52">2</tspan></text>
      <text x="95" y="35" fill="#969696">=</text>
      <text x="136" y="12" font-size="10" fill="#969696">сумма</text>
      <text x="136" y="38" font-size="24" fill="#cccccc">10</text>
    </g>
  </g>
</svg>
