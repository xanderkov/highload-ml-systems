kind: sweep
lang: c
function: walk_stride
cflags: ["-O3"]
# Здесь sizes — это не размер массива, а шаг обхода в элементах по 8 байт:
# от 8 до 1024 байт. Размер массива фиксирован внутри bench.c. Отдельный
# харнесс нужен потому, что набор точек задаётся в meta.yml, и переиспользовать
# stride с другими значениями нельзя.
sizes: [1, 2, 4, 8, 16, 32, 64, 128]
warmup: 1
repeats: 7
timeout_s: 120
