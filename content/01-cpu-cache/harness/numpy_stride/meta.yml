kind: ab
lang: python
# meta.function на Python-пути не читается: имя задаётся в bench.py.
function: reduce_stride
# 4000 x 4000 double = 128 МБ: массив заведомо не помещается ни в один уровень
# кэша, так что оба варианта упираются в память, а не в арифметику. Оба
# складывают ровно 2 000 000 чисел — разница только в том, по каким адресам.
sizes: [4000]
warmup: 1
repeats: 7
timeout_s: 120
tolerance: 1e-9
