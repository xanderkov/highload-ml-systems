kind: ab
lang: c
function: matmul
cflags: ["-O3"]
# 512 x 512 double = 2 МБ на матрицу. Меньше брать нельзя: обе матрицы должны
# перестать помещаться в L2, иначе наивный обход столбца b обходится дёшево и
# тайлингу нечего выигрывать.
sizes: [512]
warmup: 1
repeats: 7
timeout_s: 120
tolerance: 1e-9
