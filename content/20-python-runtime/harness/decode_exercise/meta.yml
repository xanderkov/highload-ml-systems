kind: ab
lang: python
sizes: [1]
# Прогрев не нужен: проверка корректности до замера уже прогоняет оба
# юнита по всем изображениям. Без него стартовый код против стартового
# укладывается примерно в 23 секунды.
warmup: 0
repeats: 11
timeout_s: 90
memory_mb: 2048
# check — точное значение, которое харнесс считает сам, или NaN, если
# декодированный тензор не совпал с ожидаемым (см. bench.py).
tolerance: 0
