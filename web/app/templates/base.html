<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ course_title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/fonts/jetbrains-mono/400.css">
  <link rel="stylesheet" href="/static/vendor/fonts/jetbrains-mono/500.css">
  <link rel="stylesheet" href="/static/vendor/fonts/jetbrains-mono/700.css">
  <link rel="stylesheet" href="/static/vendor/uplot/uPlot.min.css">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="{{ asset_prefix }}/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-home" href="/">{{ course_title }}</a>
    {% if course_sections %}
    <nav class="course-nav" aria-label="Разделы курса">
      <ol>
        {% for item in course_sections %}
        <li><a href="/section/{{ item.id }}"{% if section is defined and item.id == section.id %} aria-current="page"{% endif %}><span class="course-nav-num">{{ "%02d" | format(loop.index) }}</span> {{ item.title }}</a></li>
        {% endfor %}
      </ol>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
